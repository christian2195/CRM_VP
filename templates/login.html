<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CRM Automotriz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            margin: 0;
        }
        .macos-login-window {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .user-avatar {
            width: 80px;
            height: 80px;
            background-color: #0071e3;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.3);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        .form-control:focus {
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.3);
            border-color: #0071e3;
        }
        .btn-login {
            background-color: #0071e3;
            color: white;
            border-radius: 10px;
            padding: 10px;
            font-weight: 500;
            width: 100%;
            border: none;
            transition: all 0.2s;
        }
        .btn-login:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>

    <div class="macos-login-window">
        <div class="user-avatar">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h4 class="fw-bold mb-1">CRM VPA</h4>
        <p class="text-muted small mb-4">Ingresa tus credenciales de acceso</p>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" class="form-control" placeholder="Usuario" required autofocus>
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            
            {% if form.errors %}
                <div class="text-danger small mb-3 fw-bold">Usuario o contraseña incorrectos.</div>
            {% endif %}

            <button type="submit" class="btn-login mt-2">Iniciar Sesión</button>
        </form>
    </div>

</body>
</html>
