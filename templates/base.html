<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMVEPRO - CRM Facturación Automotriz</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegación EMVEPRO -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4" style="background-color: #0c2340;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">EMVEPRO CRM</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="target" aria-controls="navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/facturacion/cotizacion/">Cotizaciones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/facturacion/factura/">Facturas</a>
                    </li>
                </ul>
                <span class="navbar-text">
                    Módulo de Operaciones
                </span>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container">
        {% block content %}
        <!-- Aquí se inyectará el contenido de cada pantalla -->
        {% endblock %}
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
